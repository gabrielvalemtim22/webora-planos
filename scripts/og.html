<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webora. Do clique ao cliente.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 450px; align-items: center; gap: 48px; padding: 64px; background: #f9faff; color: #080808; font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif; }
  .brand { display: flex; align-items: center; gap: 15px; }
  .brand img:first-child { border-radius: 13px; }
  h1 { margin: 38px 0 24px; font-size: 78px; font-weight: 800; letter-spacing: -.08em; line-height: .98; }
  h1 span { display: block; color: #233dea; }
  p { margin: 0; color: #4b5369; font-size: 25px; font-weight: 600; }
  .tile { display: block; width: 100%; height: auto; border-radius: 34px; box-shadow: 0 24px 54px rgba(30, 53, 204, .25); }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <img src="../assets/img/marca/webora-simbolo.webp" width="58" height="58" alt="">
      <img src="../assets/img/marca/webora-logotipo-preto.webp" width="130" height="29" alt="Webora">
    </div>
    <h1>Do clique <span>ao cliente.</span></h1>
    <p>Sites profissionais, lojas online e landing pages.</p>
  </div>
  <img class="tile" src="../assets/img/marca/webora-royal-lockup.webp" width="520" height="520" alt="">
</body>
</html>
